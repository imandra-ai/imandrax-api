name: build and test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  run-5-2:
    name: OCaml 5.2
    timeout-minutes: 10
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@main
      - run: make update-submodules
      - run: docker build . -f dep/Dockerfile.5.2
  run-5-3:
    name: OCaml 5.3
    timeout-minutes: 10
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@main
      - run: make update-submodules
      - run: docker build . -f dep/Dockerfile.5.3
  tsc:
    name: ts/tsc and vitest
    runs-on: [ubuntu-latest]
    steps:
    - uses: actions/checkout@main
    - name: install node
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: tsc
      run: make -C src/ts check
    - name: vitest
      run: make -C src/ts test
  cargo-build:
    name: cargo build
    runs-on: [ubuntu-latest]
    steps:
    - uses: actions/checkout@main
    - run: make update-submodules
    - uses: dtolnay/rust-toolchain@stable
    - name: cargo build
      run: cargo build
      working-directory: src/rust/lib
  twine-conformance:
    # one job per decoder, so a red job names the decoder that fails
    name: twine-conformance (${{ matrix.decoder }} decoder)
    timeout-minutes: 10
    runs-on: [ubuntu-latest]
    strategy:
      fail-fast: false
      matrix:
        decoder: [py, ts, ocaml]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: "5.3"
        dune-cache: true
    - uses: astral-sh/setup-uv@v5
      if: matrix.decoder == 'py'
    - uses: actions/setup-node@v4
      if: matrix.decoder == 'ts'
      with:
        node-version: 22
    - run: opam pin -n .
    - run: opam install imandrax-api --deps-only --with-test -y
    - run: make -C tests/twine-conformance test-${{ matrix.decoder }}
  pyright:
    name: py/pyright
    runs-on: [ubuntu-latest]
    steps:
    - uses: actions/checkout@main
    - uses: astral-sh/setup-uv@v5
    - run: cd src/py && make typecheck
  ruff:
    name: py/ruff
    runs-on: [ubuntu-latest]
    steps:
    - uses: actions/checkout@main
    - uses: astral-sh/setup-uv@v5
    - run: cd src/py && make lint format-check
  pytest:
    name: py/pytest
    runs-on: [ubuntu-latest]
    steps:
    - uses: actions/checkout@main
    - uses: astral-sh/setup-uv@v5
    - run: cd src/py && make unit-test
      env:
        HYPOTHESIS_PROFILE: ci
