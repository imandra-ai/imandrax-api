# Client parity: what every language client must have, by section of docs/dev-language-api.md.
# Checked in CI by `python3 scripts/check_parity.py docs/parity.toml` (job `parity`):
#
# - every RPC in src/proto, except those in `rpc.not_a_method`, is a method of each client, and
#   some test of that client calls it;
# - every feature has a test marked with a `parity: <feature id>` comment in each client, unless
#   the client has a deliberate difference or a known gap for it (below).
#
# The check proves a marked test exists, not that it passes: the server-backed tests run in
# neither client's CI.
#
# A feature table holds:
#   spec = "<section>"          the section of docs/dev-language-api.md that requires it
#   <client> = "<reason>"       a deliberate difference: the client does not have it, on purpose
#   missing.<client> = "<why>"  a known gap, to be fixed; delete the entry when a marked test lands
# A client with a difference or a gap must not have a marked test for the feature.
#
# `[differences."<id>"]` lists the other deliberate differences (a name, a calling style, ...;
# docs/dev-language-api.md, Appendix B). The client explains each one in its own docs, at the
# declaration users meet it at, next to a `parity: <id>` comment: every difference must be
# annotated in its client's `lib`, and every annotation must name a difference of that client.

[clients.py]
src = "src/py/imandrax_api/v2/interface.py"
tests = "src/py/tests/client"
lib = "src/py/imandrax_api/v2"
ext = ".py"
case = "snake"
# a method definition; {name} is the RPC name, spelled per `case`
method = '^\s*(async\s+)?def\s+{name}\s*\('

[clients.ts]
src = "src/ts/lib/client.ts"
tests = "src/ts/test"
lib = "src/ts/lib"
ext = ".ts"
case = "camel"
method = '^\s*async\s+{name}\s*\('

[rpc]
# 4.3: session RPCs are part of connecting and closing; the others must not be methods
not_a_method = [
  "create_session",
  "open_session",
  "end_session",
  "qcheck_src",
  "qcheck_name",
  "get_decls",
  "gc_stats",
  "release_memory",
  "shutdown",
]

# 3.3: uids, types, ... compare by value, and maps keyed by them find an entry from any equal key
# (a uid in a term finds its declaration in the DB)
[features."mir.value_equality"]
spec = "3.3"

# 3.4: converting the same lib object twice within a conversion gives the same wrapper object
[features."mir.memo_same_wrapper"]
spec = "3.4"

# 4.2: closing ends the session once, also when repeated, and with the scoped-resource construct
[features."client.close_once"]
spec = "4.2"

# 4.2: a server rejecting the client's API version is an error telling the user to upgrade
[features."client.api_version_mismatch"]
spec = "4.2"
missing.py = "v2 has no API version mismatch error"

# 4.5: task data is fetched at most once, and concurrent first reads share one fetch
[features."task.fetch_once_shared"]
spec = "4.5"

# 4.5: what was fetched, and what is decoded from it later, stays readable after the client closes
[features."task.readable_after_close"]
spec = "4.5"

# 4.5: fetching something new after the client is closed raises the closed-client error
[features."task.fetch_after_close_raises"]
spec = "4.5"
missing.py = "v2 has no closed-client error; only a fetch after the client is garbage-collected is tested (ClientGoneError)"

# 4.5: a task fetches with another client
[features."task.set_client"]
spec = "4.5"

# 4.5: task ids compare by value; the same source in two sessions gives equal ids
[features."task.id_value_equality"]
spec = "4.5"

# 5.2: `find_*_re` matches the uid's full name from its start
[features."db.find_re_anchored"]
spec = "5.2"

# 5.2: rules are available keyed by pattern head
[features."db.rules_by_head"]
spec = "5.2"

# Deliberate differences that are not a missing feature

[differences."ts.ctor"]
client = "ts"
spec = "3.6"
what = "fields named `constructor` are `ctor`"

[differences."ts.let_"]
client = "ts"
spec = "6.3"
what = "the decomposition combinator `let` is `let_`"

[differences."ts.error_info"]
client = "ts"
spec = "3.6"
what = "server errors are `ErrorInfo`"

[differences."ts.value_map"]
client = "ts"
spec = "3.3"
what = "maps and sets keyed by value are `ValueMap` and `ValueSet`"

[differences."ts.memo_lifetime"]
client = "ts"
spec = "3.4"
what = "the conversion memo lasts as long as the lib object, not one conversion"

[differences."ts.async_report_archive"]
client = "ts"
spec = "6.4"
what = "decoding a report from an archive is asynchronous"

[differences."ts.logic_fragments"]
client = "ts"
spec = "3.1"
what = "logic fragments are a set of names, without unknown bits"

[differences."ts.async_only"]
client = "ts"
spec = "4.4"
what = "the client is asynchronous only"

[differences."py.weak_client"]
client = "py"
spec = "4.5"
what = "a task holds its client weakly: fetching after the client is garbage-collected raises `ClientGoneError`"

[differences."py.async_task_data"]
client = "py"
spec = "4.5"
what = "with `AsyncClient`, task data is a plain attribute once fetched, and `NotFetchedError` before"
