[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imandrax_api"
version = "0.20.2.2"
description = "Imandrax API client library"
requires-python = ">=3.12"
dependencies = [
    "protobuf==5.29.6",
    "requests",
    "structlog",
]

[project.optional-dependencies]
async = ["aiohttp"]

[tool.setuptools]
packages = [
    "imandrax_api",
    "imandrax_api.bindings",
    "imandrax_api.client",
    "imandrax_api.lib",
    "imandrax_api.twirp",
]
package-dir = { "imandrax_api" = "." }

[tool.pyright]
strict = ["**"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
# This directory is named `py`, which collides with the `py` distribution that
# pytest imports at startup; the default "prepend" mode would derive the module
# name `py.lib.test_twine` and fail to import it.
# TODO(long-term): move tests under $ROOT/src/py to $ROOT/tests/
addopts = "--import-mode=importlib"
testpaths = ["lib"]

[tool.ruff]
indent-width = 4
target-version = "py312"

exclude = ["lib/__init__.py", "bindings/"]

[dependency-groups]
dev = [
    "aiohttp>=3.13.2",
    "pyright>=1.1.408",
    "pytest>=9.1.1",
]
